<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas mescladas</title>
    <style>
        table {
            border-collapse: collapse;
            border: 1px solid black;

            width: 50vw;
            height: 50vh;
            padding: 50px;
        }
        td {
            text-align: center;
            vertical-align: middle ;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Teste</h1>
    <table>
        <tr>
            <td colspan="3">a</td>
            <!--<td>b</td>
            <td>c</td>-->
        </tr>
        <tr>
            <td rowspan="4">d</td>
            <td>e</td>
            <td>f</td>
        </tr>
        <tr>
            <!--<td>g</td>-->
            <td>h</td>
            <td>i</td>
        </tr>
        <tr>
            <!--<td>j</td>-->
            <td>k</td>
            <td>l</td>
        </tr>
        <tr>
            <!--<td>m</td>-->
            <td>n</td>
            <td>o</td>
        </tr>
    </table>
</body>
</html>
