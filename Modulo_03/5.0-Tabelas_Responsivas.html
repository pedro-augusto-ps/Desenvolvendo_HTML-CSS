<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas em dispositivos pequenos</title>
    <style>
        table {
            border-collapse: collapse;
            border: 1px solid black;
        }
        td, th {
            padding: 8px;
            border: 1px solid black;
        }
        tbody > tr:nth-child(odd) {
            background-color: lightgray;
        }
        div#container_table {
            overflow-x: auto; /*Para não ter rolagem lateral na tela, e sim na tabela*/
            }

    </style>
</head>
