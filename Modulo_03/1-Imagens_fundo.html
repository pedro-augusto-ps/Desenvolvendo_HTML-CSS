<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colocando imagens de fundo</title>
    <style>

        body {
            background-image: url(Arquivos/wallpaper002.jpg);
        }
        .quadrado {  /*Div que cria os três quadrados*/
            display: inline-block;
            background-color: lightgreen;

            border-radius: 8px;
            border: 2px solid black;

            width: 300px;
            height: 300px;
        }

        div#q1 {
            background-color: blue;
        }

        div#q2 {
            background-image: linear-gradient(to bottom, yellow, red);
        }

        div#q3 {
            /*IMAGENS URL*/
            background-image: url(Arquivos/pattern003.png);
        }
    </style>
</head>
<body>
    <div class="quadrado" id="q1">

    </div>
    <div class="quadrado" id="q2">
        
    </div>
    <div class="quadrado" id="q3">
        
    </div>
</body>
</html>
