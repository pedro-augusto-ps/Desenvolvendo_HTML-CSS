<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        body {
            margin: 2%;
        }
        table {
            width: 30vw;
            height: 30vh;
            padding: 10px;
            border-collapse: collapse;
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: center;
            vertical-align: middle;
            border: 1px solid black;
        }
        caption {
            font-size: 1.5em;
            font-weight: bolder;
            text-transform: uppercase;
        }
        .destacar {
            text-decoration-line: overline;
        }
        .coluna_nome {      /*Toda coluna irá ter essa propriedade agora*/
            background-color: lightcyan;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="coluna_nome"> <!--Toda coluna está selecionada aqui-->
            <col class="coluna_sex">
            <col class="coluna_idade">
            <col class="coluna_profissao">
        </colgroup>
        <tr>
            <caption>Cadastro</caption>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>

        </tr>
