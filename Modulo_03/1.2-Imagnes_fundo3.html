<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando imagens com fundo</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        div.caixas {
            background-image: url(Arquivos/wallpaper003.jpg);
            margin: 10px;
            width: 1200px;
            height: 200px;
            border: 1px solid black;
            border-radius: 6px;
        }    
        div#c1 {
            background-position: center top;
        }
        div#c2 {
            background-position: center center;
        }
        div#c3 {
            background-position: center bottom;
        }
        div#c4 {

            background-position: center center;
        }
        div#teste {
            margin: 10px;
            background-image: url(Arquivos/wallpaper003.jpg);
            background-position: center;
            width: 1000px;
            height: 1000px;
            background-size: cover;
        }
    </style>
</head>
<body>
    <div class="caixas" id="c1"></div>
    <div class="caixas" id="c2"></div>
    <div class="caixas" id="c3"></div>
    <div class="caixas" id="c4"></div>
    <div  id="teste"></div>


</body>
</html>
