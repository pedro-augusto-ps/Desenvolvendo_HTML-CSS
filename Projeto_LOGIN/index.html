<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto LOGIN</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media_query.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> <!--API
    Do Google para os ícones-->
</head>
<body>
    <main>
        <section id="section_login">
            <div id="imagem_login">
                <!--Background-->>
            </div>
            <div id="formulario_login">
                <h1>Login</h1>
                <p>Boas-vindas!</p>
                <p>Insira seu <strong>email</strong> e <strong>senha</strong> para continuar!</p>
                <form action="cadastro.js" method="post" autocomplete="on">
                    <div class="campos_login">
                        <span class="material-icons">person</span>
                        <input type="email" name="email" id="idemail" placeholder="Seu email: " autocomplete="email" required maxlength="50">
                        <label for="idemail">Email</label>
                    </div>
                    <div class="campos_login">
                        <span class="material-icons">key</span>
                        <input type="password" name="pass" id="idpass" placeholder="Sua senha: " required minlength="8" maxlength="25">
                        <label for="idpass">Senha</label>
                    </div>
                    <input type="submit" value="Entrar">
                    <a href="esqueci_a_senha" class="butao">
                        Esqueci a senha <i class= "material-icons">mail</i></a>

                </form>
            </div>
        </section>
    </main>
</body>
</html>
