<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo PseudoClasses</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
        }
        div:hover {
            color: red;
            
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>

    <h2>Olhe isso:</h2>
    <div>
        Passe o MOUSE aqui!
        <p>SURPRESA!</p>
    </div>
</body>
</html>
