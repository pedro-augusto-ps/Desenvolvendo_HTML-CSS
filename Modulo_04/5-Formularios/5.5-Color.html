<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos color, Range</title>
</head>
<body>
    <h1>Testando mais algusn elementos</h1>
    <form action="cadastro.js" method="get">
        <fieldset>
            <legend>Escolhas</legend>
            <!--Value: Começa com aquela cor-->
            <label for="idcolor">Escolha a cor</label>
            <input type="color" name="color" id="idcolor" value="#ffffff"><br>

            <!--Min e Max limita o range-->
            <label for="idsatisfacao">Qual seu nível de satisfação?</label>
            <input type="range" name="satisfacao" id="idsatisfacao" min="0" max="10">
        </fieldset>

        <input type="submit" value="Enviar">
    </form>
    
</body>
</html>
