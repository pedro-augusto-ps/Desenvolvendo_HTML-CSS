<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET e POST</title>
</head>
<body>
    <h1>Aprendendo GET/POST</h1>
    <form action="cadastro.js" autocomplete="on" method="post">
        <p>
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" autocomplete="username" required minlength="5" 
            maxlength="30" placeholder="Insira o usuário"> <!--placeholder é a dica no fundo da caixa-->
        </p>
        <p>
            <label for="isenha">Senha: </label>
            <input type="password" name="pass" id="ipass" required minlength="8">
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
