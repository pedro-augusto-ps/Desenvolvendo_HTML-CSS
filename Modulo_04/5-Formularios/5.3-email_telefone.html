<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emails e Telefone</title>
</head>
<body>
    <form action="cadastro.js" method="post" autocomplete="on">
        <fieldset>
        <legend>Dados Pessoais</legend> <!--Agrupa dados / Separa-->
            <p>
                <label for="idnome">NOME: </label>
                <input type="email" name="nome" id="idnome"  required minlength="6" maxlength="20">
            </p>
            <p>
                <label for="idemail">EMAIL: </label>
                <input type="email" name="email" id="idemail" required>
            </p>
            <p>
                <label for="idtel">TELEFONE: </label>
                <input type="tel" name="tel" id="idtel"  required placeholder="(xx)xxxx-xxxx"> 
                <!--Estudar mais sobre expressões regulares-->
            </p>
        </fieldset>
    </form>
</body>
</html>
