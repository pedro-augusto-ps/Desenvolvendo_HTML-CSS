<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output</title>
</head>
<body>
    <h1>Exemplo de OUTPUT utilizando RANGE</h1>
    <form action="cadastro.js" method="get">
        <p>
            <label for="idval_range">Avalie-nos!</label>
            <input type="range" name="valrange" id="idval_range"
            oninput="out_idrange.innerHTML = Number(idval_range.value)">

            <output name="out_range" id="out_idrange">5</output>
        </p>
    </form>
</body>
</html>
