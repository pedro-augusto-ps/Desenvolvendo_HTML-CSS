<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando IFRAMES </title>
</head>
<body>
    <h1>Praticando IFRAMEs</h1>
    <p>Acesse <a href="https://www.cursoemvideo.com/curso/curso-html5-e-css3-modulo-4-de-5-40-horas/"
        target="_blank" hreflang="pt-br">Curso em Vído</a> Para saber mais</p>
    <hr>
    <p>Acesse
        <iframe src="https://www.cursoemvideo.com/curso/curso-html5-e-css3-modulo-4-de-5-40-horas/" 
        frameborder="0">
        <!--IMPORTANTE!
        TUDO QUE COLOCAR AQUI FICA CASO NÃO DE CERTO O IFRAME -->
        [Seu navegador não é compatível]
        <p>
            Acesse: <a href="https://www.cursoemvideo.com/curso/curso-html5-e-css3-modulo-4-de-5-40-horas/"></a>
        </p>
    </iframe> <!--Muito top-->
    
        Para saber mais
        <!--PARAMETROS:
        frameborder = 0 ou 1
        tem widht e height, prevalece a css e não "inline"
        scolling = yes / no
        -->
    </p>
</body>
</html>
