<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo align-content</title>
    <style>
        .container {
            display: flex;
            background-color: lightgreen;
            height: 500px;
            flex-flow: row nowrap;
            justify-content: center;
        }
        .item {
            margin: 10px;
            text-align: center;
            background-color: green;
            border: 1px solid black;
            padding: 20px;
            align-self: center;
            flex-basis: 100px;
            flex-shrink: 0;

        }    
        #i1 {
            flex-grow: 0;
            flex-shrink: 1;
        }
        #i2 {
            flex-grow: 2;
            flex-shrink: 0;
        }
        #i3 {
            flex-grow: 1;
            flex-shrink: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">
            A
        </div>
        <div class="item" id="i2">
            B
        </div>
        <div class="item" id="i3">
            C
        </div>
        <div class="item" id="i4">
            D
        </div>
    </div>
</body>
</html>
