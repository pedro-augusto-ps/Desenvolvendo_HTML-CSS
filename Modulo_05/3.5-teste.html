<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container {
            display: grid;
            grid-template-columns: 10px 1fr 10px;
            grid-template-rows: 100px 500px 100px;
            width: 100vw;
            height: 100vh;            
        }
        header {
            grid-area: 1/2/1/3;
            background-color: blue;
        }
        main {
            grid-area: 2/2/2/3;
            background-color: red;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <header>
        </header>
        <main>
        </main>
        <section>
        </section>
    </div>
</body>
</html>
