<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo align-content</title>
    <style>
        .container {
            display: flex;
            background-color: lightgreen;

            flex-flow: row nowrap   ;
        }
        .item {
            text-align: center;
            background-color: green;
            border: 1px solid black;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">
            A
        </div>
        <div class="item">
            B
        </div>
        <div class="item">
            C
        </div>
        <div class="item">
            D
        </div>
        <div class="item">
            E
        </div>
        <div class="item">
            F
        </div>
        <div class="item" style="order: -2;"> <!--Ordena em ordem crescente-->
            G
        </div>

    </div>
</body>
</html>
