<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizar tudo</title>
    <style>
        .container {
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
        }
        .itens {
            background-color: blue;
            }
    </style>
</head>
<body>
    <h1>Tutorial de como centralizar tudo utilizando flexbox</h1>
    <p>Para centralizar, basta usar no .container, as seguintes instruções: </p>
    <ul>
        <li>justify-content: center</li>
        <li>align-itens: center</li>
    </ul>
    <p>EXEMPLO:</p>
    <div class="container">
        <div class="itens">
            <p>A</p>
            <p>B</p>
            <p>C</p>
        </div>
    </div>
</body>
</html>
