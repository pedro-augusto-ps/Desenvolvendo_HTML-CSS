<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        * {
            box-sizing: border-box;
            padding: 0px;
            margin: 0px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 150px;
            grid-template-rows: 80px 40px 1fr 40px;
            width: 100vw;
            height: 100vh;

        }

        #topo {
            background-color: black;
            color: white;
            grid-area: 1 / 1 / 2 / -1; /*Linha coluna linha coluna*/
        }

        #menu {
            background-color: red;
            grid-area: 2 / 1 / 3 / -1; /*Linha coluna linha coluna*/
        }

        #principal {
            background-color: yellow;
            grid-area: 3 / 1 / 4 / 2;
        }

        #secundario {
            background-color: green;
            grid-area: 3 / 2 / 4 / 3;
        }

        #rodape {
            background-color: gray;
            grid-area: 4 / 1 / 5 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="caixa" id="topo">
            Topo
        </header>
        <nav class="caixa" id="menu">
            Menu 
        </nav>
        <main class="caixa" id="principal">
            Main
        </main>
        <aside class="caixa" id="secundario">
            Lado
        </aside>
        <footer class="caixa" id="rodape">
            Rodapé
        </fo1oter>
    </div>
</body>
</html>
